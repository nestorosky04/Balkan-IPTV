name: Build Balkan playlist
on:
  schedule: [{cron: "0 4 * * *"}]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 balkan_m3u.py -o balkan.m3u
      - run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add balkan.m3u
          git commit -m "update playlist" || exit 0
          git push
